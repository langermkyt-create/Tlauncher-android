name: Android Minecraft Launcher APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Android Minecraft runtime
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: amethyst
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build dependencies
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.3.13750724"
          yes | sdkmanager --licenses

      - name: Download multi-architecture Java runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: amethyst/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare translations and build directory
        working-directory: amethyst
        run: |
          bash scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Minecraft Java Android launcher
        working-directory: amethyst
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/tlauncher-android-runtime-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tlauncher-android-runtime-debug
          path: amethyst/out/tlauncher-android-runtime-debug.apk
          if-no-files-found: error
          retention-days: 30
